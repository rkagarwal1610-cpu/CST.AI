<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salesforce MIS | Sign in</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;font:15px Inter,system-ui,Arial;color:#182230;display:grid;min-height:100vh;place-items:center}.card{background:white;width:min(420px,92vw);padding:34px;border:1px solid #e1e7ef;border-radius:18px;box-shadow:0 16px 50px #1b2b4410}.brand{font-size:12px;color:#64748b;letter-spacing:.15em;font-weight:800}.logo{font-size:25px;font-weight:750;margin:10px 0 5px}.sub{color:#64748b;margin:0 0 26px}label{display:block;font-size:13px;font-weight:650;margin:15px 0 7px}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}button{margin-top:22px;width:100%;padding:12px;background:#2563eb;color:white;border:0;border-radius:9px;font-weight:700;font-size:15px;cursor:pointer}.error{color:#b42318;font-size:13px;margin-top:12px;min-height:18px}.hint{font-size:12px;color:#64748b;line-height:1.5;margin-top:18px}</style></head><body><form class="card" id="login"><div class="brand">GINESYS · OPERATIONS</div><div class="logo">Salesforce MIS</div><p class="sub">Sign in to the team dashboard</p><label>Application username</label><input name="username" autocomplete="username" required><label>Application password</label><input name="password" type="password" autocomplete="current-password" required><button>Sign in</button><div class="error" id="error"></div><div class="hint">Access is restricted to authorized team members. Salesforce credentials are entered only after signing in.</div></form><script>document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))});const d=await r.json();if(d.ok)location.href='/';else document.getElementById('error').textContent=d.error||'Unable to sign in.'})</script></body></html>
